[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-derivatives-valuation-toolkit"
version = "0.1.0"
description = "Synthetic wholesale power price modeling and energy derivatives/optionality valuation toolkit (educational / portfolio project, not for live trading)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["energy_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
